[package]
name = "voxpipe"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.7" }
glib = "0.20"
gtk = { package = "gtk4", version = "0.9" }
gstreamer = "0.23"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["tls"] }

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"
bindgen = "0.69"
